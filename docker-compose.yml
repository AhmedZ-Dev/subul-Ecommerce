name: subul-ecommerce

# Public entry is Traefik alone. `api`, `admin` and `storefront` no longer
# publish ports: they used to bind 0.0.0.0, which put the API on the internet
# directly rather than behind the edge.
#
# PUBLIC_ORIGIN is the browser-facing origin of the storefront and API. It is
# an IP over HTTP until a domain exists; see deploy/traefik/ for the switch.
# Note that PUBLIC_API_URL and PUBLIC_SITE_URL are compiled INTO the frontend
# bundles at image build time, so changing them requires rebuilding the admin
# and storefront images, not just restarting them.

services:
  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - "80:80"
      - "443:443"
      - "3000:3000"
    volumes:
      # Read-only, and no Docker socket: routing comes from these files.
      - ./deploy/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./deploy/traefik/dynamic:/etc/traefik/dynamic:ro
      - letsencrypt:/letsencrypt
    depends_on:
      - api
      - admin
      - storefront

  db:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5433:5432"
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-subul-Ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-subul}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the VM .env file}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10.1-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: subul-backend:latest
    # `image:` alone meant a fresh checkout could only ever try to pull these
    # from a registry that does not host them. With `build:` present Compose
    # builds what is missing and reuses an already-tagged image otherwise, so
    # the same file works on a dev machine and on a host with prebuilt images.
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: >-
        Host=db;Port=5432;Database=${POSTGRES_DB:-subul-Ecommerce};Username=${POSTGRES_USER:-subul};Password=${POSTGRES_PASSWORD};Pooling=true;
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      # The storefront now shares the API's origin through Traefik, so only the
      # admin panel is genuinely cross-origin. The storefront entry is kept for
      # direct-origin callers and for the split-host layout after the domain.
      Cors__AllowedOrigins__0: ${ADMIN_ORIGIN:-http://49.12.219.180:3000}
      Cors__AllowedOrigins__1: ${STOREFRONT_ORIGIN:-http://49.12.219.180}
      # Which upstreams may set X-Forwarded-*. Must cover the Docker network
      # Traefik runs on and nothing wider: trusting every source would let a
      # caller spoof X-Forwarded-For and get its own rate-limit bucket.
      ForwardedHeaders__TrustedNetworks__0: ${TRUSTED_PROXY_NETWORK:-172.16.0.0/12}
      Jwt__Secret: ${JWT_SECRET:?Set JWT_SECRET in the VM .env file}
      Jwt__Issuer: ${JWT_ISSUER:-subul-admin}
      Jwt__Audience: ${JWT_AUDIENCE:-subul-admin-panel}
      Jwt__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES:-480}
      # The single first admin account, created only while admin_users is empty.
      # Leaving ADMIN_BOOTSTRAP_PASSWORD unset is the recommended path: the API
      # generates one, logs it once at Warning, and requires it to be changed at
      # first sign-in. Read it with `docker compose logs api`.
      AdminBootstrap__Enabled: ${ADMIN_BOOTSTRAP_ENABLED:-true}
      AdminBootstrap__Name: ${ADMIN_BOOTSTRAP_NAME:-Administrator}
      AdminBootstrap__Email: ${ADMIN_BOOTSTRAP_EMAIL:-admin@subul.iq}
      AdminBootstrap__Password: ${ADMIN_BOOTSTRAP_PASSWORD:-}
    volumes:
      - ./img:/img

  admin:
    image: subul-admin:latest
    build:
      context: ./client/admin-panel
      dockerfile: Dockerfile
      args:
        # Compiled into the browser bundle, so it must match the runtime value
        # below. Changing it requires a rebuild, not a restart.
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://49.12.219.180/api}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://49.12.219.180/api}
      # Server-side Auth.js calls must stay on Docker's internal network.
      # Do not expose this as NEXT_PUBLIC_*; browsers cannot resolve `api`.
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:5101/api}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in the VM .env file}
      AUTH_TRUST_HOST: "true"

  storefront:
    image: subul-storefront:latest
    build:
      context: ./client/storefront
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://49.12.219.180/api}
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://49.12.219.180}
        # The /img rewrite is resolved by the Next server inside the network,
        # where the public origin points at the container's own loopback. Baked
        # in at build time because rewrites() runs during the build.
        INTERNAL_API_ORIGIN: ${INTERNAL_API_ORIGIN:-http://api:5101}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://49.12.219.180/api}
      NEXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://49.12.219.180}
      # Needed at runtime as well as at build time, for two different consumers:
      # the build bakes it into the /img rewrite, while lib/api-client.ts reads
      # it per request so server-rendered pages call the API in-network instead
      # of via the public origin, which is unreachable from inside a container.
      INTERNAL_API_ORIGIN: ${INTERNAL_API_ORIGIN:-http://api:5101}

volumes:
  pgdata:
  letsencrypt:
