name: subul-ecommerce

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-subul-Ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-subul}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the VM .env file}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10.1-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: subul-backend:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: >-
        Host=db;Port=5432;Database=${POSTGRES_DB:-subul-Ecommerce};Username=${POSTGRES_USER:-subul};Password=${POSTGRES_PASSWORD};Pooling=true;
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      Cors__AllowedOrigins__0: ${ADMIN_ORIGIN:-http://49.12.219.180:3000}
      Cors__AllowedOrigins__1: ${STOREFRONT_ORIGIN:-http://49.12.219.180:3001}
      Jwt__Secret: ${JWT_SECRET:?Set JWT_SECRET in the VM .env file}
      Jwt__Issuer: ${JWT_ISSUER:-subul-admin}
      Jwt__Audience: ${JWT_AUDIENCE:-subul-admin-panel}
      Jwt__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES:-480}
    volumes:
      - ./img:/img
    ports:
      - "5101:5101"

  admin:
    image: subul-admin:latest
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://49.12.219.180:5101/api}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in the VM .env file}
      AUTH_TRUST_HOST: "true"
    ports:
      - "3000:3000"

  storefront:
    image: subul-storefront:latest
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://49.12.219.180:5101/api}
      NEXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://49.12.219.180:3001}
    ports:
      - "3001:3001"

volumes:
  pgdata:
